<div class="card">
  <div class="card-header">
    <h3 class="mb-0">Add New Product</h3>
  </div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <!-- Product Name -->
      <div class="row">
        <div class="col-md-12 mb-3">
          <label class="form-label">Product Name</label>
          <input type="text" class="form-control" formControlName="name" required />
        </div>
      </div>

      <!-- Description -->
      <div class="mb-4">
        <label class="form-label">Description</label>
        <ckeditor [editor]="Editor" formControlName="description"
          [config]="{ placeholder: 'Enter product description here...' }" class="static_pages-editor"></ckeditor>
      </div>

      <!-- Category & Subcategory -->
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Category</label>
          <select class="form-select" formControlName="category_id" (change)="onCategoryChange()">
            <option value="">-- Select Category --</option>
            <option *ngFor="let category of categories" [value]="category._id">{{ category.name }}</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Sub Category</label>
          <select class="form-select" formControlName="sub_category_id">
            <option value="">-- Select Subcategory --</option>
            <option *ngFor="let sub of subcategories" [value]="sub._id">{{ sub.name }}</option>
          </select>
        </div>
      </div>

      <!-- Pricing & Inventory -->
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Unit Price</label>
          <input type="number" class="form-control" formControlName="unit_price" min="0" />
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Discount</label>
          <input type="number" class="form-control" formControlName="discount" min="0" />
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Discount Type</label>
          <select class="form-select" formControlName="discount_type">
            <option value="flat">Flat</option>
            <option value="percent">Percentage</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Tax (%)</label>
          <input type="number" class="form-control" formControlName="tax" min="0" />
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Stock</label>
          <input type="number" class="form-control" formControlName="current_stock" min="0" />
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Min Qty</label>
          <input type="number" class="form-control" formControlName="min_qty" min="1" />
        </div>
      </div>

      <!-- Thumbnail & Images -->
      <div class="row mt-2">
        <div class="col-md-6 mb-4">
          <label class="form-label">Images</label>
          <input type="file" class="form-control" (change)="onMultiplePhotosSelected($event)" multiple
            accept="image/*" />
          <div class="mt-3 d-flex flex-wrap gap-3">
            <div *ngFor="let img of photoPreviews; let i = index" class="position-relative border rounded p-1"
              style="max-width: 120px">
              <img [src]="img" class="img-fluid rounded" style="max-height: 100px; object-fit: cover" />
              <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 translate-middle"
                (click)="removePhoto(i)">❌</button>
            </div>
          </div>
        </div>

        <div class="col-md-6 mb-4">
          <label class="form-label">Thumbnail</label>
          <input type="file" class="form-control" (change)="onImageSelected($event)" />
          <div *ngIf="imagePreview" class="mt-3 position-relative d-inline-block">
            <img [src]="imagePreview" class="rounded border" style="max-height: 150px" />
            <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 translate-middle"
              (click)="removeThumbnail()">❌</button>
          </div>
        </div>
      </div>

      <!-- Variants Section -->
      <div class="mb-4">
        <label class="form-label">Variants (e.g., Size, Color)</label>
        <div formArrayName="variants">
          <div *ngFor="let variant of variantsControls; let i = index" [formGroupName]="i"
            class="border rounded p-3 mb-2">
            <div class="row">
              <div class="col-md-5 mb-2">
                <input type="text" class="form-control" formControlName="name" placeholder="Variant Name (e.g. Size)" />
              </div>
              <div class="col-md-5 mb-2">
                <input type="text" class="form-control" formControlName="values"
                  placeholder="Comma-separated values (e.g. S,M,L)" />
              </div>
              <div class="col-md-2 text-end">
                <button class="btn btn-danger" type="button" (click)="removeVariant(i)">❌</button>
              </div>
            </div>
          </div>
        </div>
        <div class="text-end mt-2">
          <button class="btn btn-sm btn-secondary" type="button" (click)="addVariant()">➕ Add Variant</button>
          <button class="btn btn-sm btn-outline-primary ms-2" type="button" (click)="generateVariantOptions()">🔄
            Generate Combinations</button>
        </div>
      </div>


     <!-- Variation Options Section -->
<div class="mb-4" formArrayName="variation_options">
  <label class="form-label">Variation Combinations</label>

  <div
    *ngFor="let option of variationOptionsControls; let i = index"
    [formGroupName]="i"
    class="border rounded p-3 mb-3"
  >
    <div class="row">
      <div class="col-md-4 mb-2">
        <label>Values</label>
        <input
          type="text"
          class="form-control"
          [value]="formatVariantValues(option.get('variant_values')?.value)"
          disabled
        />
      </div>

      <div class="col-md-2 mb-2">
        <label>Price</label>
        <input type="number" class="form-control" formControlName="price" min="0" />
      </div>

      <div class="col-md-2 mb-2">
        <label>Stock</label>
        <input type="number" class="form-control" formControlName="stock" min="0" />
      </div>

      <!-- Variant Images Upload -->
      <div class="col-md-4 mb-2">
        <label>Upload Images for this Variant</label>
        <input
          type="file"
          class="form-control"
          (change)="onVariantImagesSelected($event, i)"
          multiple
          accept="image/*"
        />

        <!-- Variant images previews -->
        <div class="mt-2 d-flex flex-wrap gap-2">
          <div
            *ngFor="let img of option.get('images')?.value; let idx = index"
            class="position-relative border rounded p-1"
            style="max-width: 90px"
          >
            <img
              [src]="img"
              class="img-fluid rounded"
              style="max-height: 80px; object-fit: cover"
              alt="Variant Image"
            />
            <button
              type="button"
              class="btn btn-sm btn-danger position-absolute top-0 end-0 translate-middle"
              (click)="removeVariantImage(i, idx)"
            >
              ❌
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


      <!-- Submit Button -->
      <div class="text-center">
        <button type="submit" class="btn btn-primary">
          {{ isSubmitting ? "Submitting..." : "Create Product" }}
        </button>
      </div>
    </form>
  </div>
</div>
