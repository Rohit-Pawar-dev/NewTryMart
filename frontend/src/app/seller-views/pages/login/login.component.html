<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm border-0 rounded">
        <div class="card-header bg-primary text-white text-center py-3">
          <h4 class="mb-0">Seller Login</h4>
        </div>
        <div class="card-body p-4">
          <form [formGroup]="loginForm" (ngSubmit)="!otpSent ? onSubmit() : onVerifyOtp()">
            <!-- Mobile Number -->
            <div class="mb-3">
              <label for="mobile" class="form-label fw-semibold">Mobile Number</label>
              <input
                type="tel"
                id="mobile"
                maxlength="10"
                class="form-control"
                formControlName="mobile"
                [readonly]="otpSent"
                placeholder="Enter 10-digit mobile number"
                [class.is-invalid]="
                  loginForm.controls.mobile.invalid && loginForm.controls.mobile.touched
                "
                autocomplete="off"
              />
              <div class="invalid-feedback" *ngIf="loginForm.controls.mobile.errors">
                <span *ngIf="loginForm.controls.mobile.hasError('required')">Mobile is required.</span>
                <span *ngIf="loginForm.controls.mobile.hasError('pattern')">Enter a valid 10-digit number.</span>
              </div>
            </div>

            <!-- Send OTP Button -->
            <button
              *ngIf="!otpSent"
              type="submit"
              class="btn btn-primary w-100 mb-3"
              [disabled]="loading || loginForm.controls.mobile.invalid"
            >
              {{ loading ? 'Sending OTP...' : 'Send OTP' }}
            </button>

            <!-- OTP Section -->
            <div *ngIf="otpSent">
              <div class="mb-3">
                <label for="otp" class="form-label fw-semibold">Enter OTP</label>
                <input
                  type="text"
                  id="otp"
                  maxlength="4"
                  class="form-control"
                  formControlName="otp"
                  placeholder="Enter 4-digit OTP"
                  [class.is-invalid]="
                    loginForm.controls.otp.invalid && loginForm.controls.otp.touched
                  "
                  autocomplete="off"
                  [disabled]="loading"
                />
                <div class="invalid-feedback" *ngIf="loginForm.controls.otp.errors">
                  <span *ngIf="loginForm.controls.otp.hasError('required')">OTP is required.</span>
                  <span *ngIf="loginForm.controls.otp.hasError('pattern')">Enter a valid 4-digit OTP.</span>
                </div>
              </div>

              <!-- Verify OTP Button -->
              <button
                type="button"
                class="btn btn-success w-100 mb-2"
                [disabled]="loading || loginForm.controls.otp.invalid"
                (click)="onVerifyOtp()"
              >
                {{ loading ? 'Verifying...' : 'Verify OTP' }}
              </button>

              <!-- Resend OTP Button -->
              <button
                type="button"
                class="btn btn-outline-secondary w-100"
                [disabled]="loading"
                (click)="onResendOtp()"
              >
                Resend OTP
              </button>
            </div>
          </form>
        </div>

        <div class="card-footer text-center bg-light">
          <small>Don't have an account?</small>
          <button
            class="btn btn-link fw-semibold p-0 ms-2"
            (click)="navigateToRegister()"
            [disabled]="loading"
          >
            Register as Seller
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
