<div class="card shadow-sm mx-auto my-5" style="max-width: 900px; border-radius: 0.5rem;">
  <div class="card-header bg-primary text-white">
    <h3 class="mb-0 text-center">Register as Seller</h3>
  </div>
  <div class="card-body p-4">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="row g-3">
        <!-- Name -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
          <input
            type="text"
            formControlName="name"
            class="form-control"
            [ngClass]="{ 'is-invalid': registerForm.get('name')?.invalid && registerForm.get('name')?.touched }"
          />
          <div class="invalid-feedback" *ngIf="registerForm.get('name')?.errors?.['required']">Name is required.</div>
          <div class="invalid-feedback" *ngIf="registerForm.get('name')?.errors?.['minlength']">
            Name must be at least 3 characters.
          </div>
        </div>

        <!-- Gender -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Gender</label>
          <select formControlName="gender" class="form-select">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>

        <!-- Mobile -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Mobile <span class="text-danger">*</span></label>
          <input
            type="text"
            maxlength="10"
            formControlName="mobile"
            class="form-control"
            [ngClass]="{ 'is-invalid': registerForm.get('mobile')?.invalid && registerForm.get('mobile')?.touched }"
          />
          <div class="invalid-feedback" *ngIf="registerForm.get('mobile')?.errors?.['required']">Mobile is required.</div>
          <div
            class="invalid-feedback"
            *ngIf="registerForm.get('mobile')?.errors?.['minlength'] || registerForm.get('mobile')?.errors?.['maxlength']"
          >
            Mobile must be 10 digits.
          </div>
        </div>

        <!-- Email -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
          <input
            type="email"
            formControlName="email"
            class="form-control"
            [ngClass]="{ 'is-invalid': registerForm.get('email')?.invalid && registerForm.get('email')?.touched }"
          />
          <div class="invalid-feedback" *ngIf="registerForm.get('email')?.errors?.['required']">Email is required.</div>
          <div class="invalid-feedback" *ngIf="registerForm.get('email')?.errors?.['email']">Invalid email format.</div>
        </div>

        <!-- Shop Name -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Shop Name <span class="text-danger">*</span></label>
          <input
            type="text"
            formControlName="shop_name"
            class="form-control"
            [ngClass]="{ 'is-invalid': registerForm.get('shop_name')?.invalid && registerForm.get('shop_name')?.touched }"
          />
          <div class="invalid-feedback" *ngIf="registerForm.get('shop_name')?.errors?.['required']">Shop name is required.</div>
        </div>

        <!-- Business Category -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Business Category <span class="text-danger">*</span></label>
          <select
            formControlName="business_category"
            class="form-select"
            [ngClass]="{ 'is-invalid': registerForm.get('business_category')?.invalid && registerForm.get('business_category')?.touched }"
          >
            <option value="" disabled>Select Category</option>
            <option *ngFor="let cat of businessCategories" [value]="cat._id">{{ cat.name }}</option>
          </select>
          <div class="invalid-feedback" *ngIf="registerForm.get('business_category')?.errors?.['required']">
            Business category is required.
          </div>
        </div>

        <!-- Address -->
        <div class="col-md-12">
          <label class="form-label fw-semibold">Address</label>
          <textarea formControlName="address" class="form-control" rows="2"></textarea>
        </div>

        <!-- Country, State, City, Pincode -->
        <div class="col-md-3">
          <label class="form-label fw-semibold">Country</label>
          <input type="text" formControlName="country" class="form-control" />
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">State</label>
          <input type="text" formControlName="state" class="form-control" />
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">City</label>
          <input type="text" formControlName="city" class="form-control" />
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Pincode</label>
          <input type="text" formControlName="pincode" class="form-control" />
        </div>

        <!-- GST Number -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">GST Number</label>
          <input type="text" formControlName="gst_number" class="form-control" />
        </div>

        <!-- Profile Image Upload -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Profile Image <span class="text-danger">*</span></label>
          <input
            type="file"
            accept="image/*"
            (change)="onProfileSelected($event)"
            class="form-control"
            [class.is-invalid]="registerForm.get('profile_image')?.invalid && registerForm.get('profile_image')?.touched"
            required
          />
          <div class="invalid-feedback" *ngIf="registerForm.get('profile_image')?.errors?.['required']">
            Profile image is required.
          </div>

          <div *ngIf="profilePreview" class="mt-2">
            <img [src]="profilePreview" alt="Profile Preview" class="img-thumbnail" style="max-height: 100px" />
          </div>
        </div>

        <!-- Logo Upload -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Logo</label>
          <input type="file" accept="image/*" (change)="onLogoSelected($event)" class="form-control" />
          <div *ngIf="imagePreview" class="mt-2">
            <img [src]="imagePreview" alt="Logo Preview" class="img-thumbnail" style="max-height: 100px" />
          </div>
        </div>

      </div>

      <div class="mt-4 text-center">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isSubmitting || registerForm.invalid"
        >
          {{ isSubmitting ? 'Registering...' : 'Register' }}
        </button>
      </div>
    </form>
  </div>
</div>
